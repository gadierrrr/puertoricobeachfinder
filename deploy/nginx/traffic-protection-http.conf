# Install in /etc/nginx/conf.d/beach-traffic-protection.conf (http context).
# Match the original URL so locale/front-controller rewrites share one bucket.
map $request_uri $bf_request_path {
    ~^([^?]*) $1;
    default /;
}
map $bf_request_path $bf_login_key {
    default "";
    ~^/(login(?:\.php)?/?|es/iniciar-sesion/?|auth/google(?:/index\.php)?/?)$ $binary_remote_addr;
}
limit_req_zone $bf_login_key zone=bf_login:10m rate=30r/m;

# Generate this include from the same trusted ranges as real-IP restoration.
# Use the connection peer, NOT the restored visitor IP, to trust CF headers.
geo $realip_remote_addr $bf_cloudflare_peer {
    default 0;
    include /etc/nginx/cloudflare-geo-ranges.conf;
}
map "$bf_cloudflare_peer:$http_cf_ipcountry" $bf_country {
    default "unknown";
    ~^1:([A-Z][A-Z])$ $1;
}
map $bf_cloudflare_peer $bf_ray {
    default "";
    1 $http_cf_ray;
}
# No query strings, cookies, authorization headers, or referrers in this log.
log_format bf_traffic escape=json
    '{"time":"$time_iso8601","client":"$remote_addr",'
    '"country":"$bf_country","cloudflare":"$bf_cloudflare_peer",'
    '"ray":"$bf_ray","method":"$request_method",'
    '"path":"$bf_request_path","status":$status,'
    '"seconds":$request_time,"limit":"$limit_req_status"}';
